<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ Legacy Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-950: #2B1E33;
    --plum-800: #3D2645;
    --plum-700: #4A2C5E;
    --plum-500: #6E4A82;
    --plum-200: #E4D9EA;
    --plum-100: #F1EAF4;
    --ivory: #FAF7F4;
    --paper: #FFFFFF;
    --gold: #B8935A;
    --gold-100: #F5EBDA;
    --rose: #A14550;
    --rose-100: #F7E6E8;
    --sage: #4C6F52;
    --sage-100: #E7EFE8;
    --amber: #8A5F1E;
    --amber-100: #FAF0DF;
    --ink-muted: #6E6277;
    --line: #E5DDE9;
    --radius-sm: 8px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Public Sans', -apple-system, sans-serif;
    background: var(--ivory);
    color: var(--plum-950);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .serif {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    margin: 0;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    text-align: inherit;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
  }
  button:disabled { opacity: 0.55; cursor: default; }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--plum-700);
    outline-offset: 2px;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--ivory);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(43,30,51,0.08);
  }

  /* ---------- Demo banner ---------- */
  .demo-banner {
    position: relative;
    z-index: 20;
    background: var(--gold);
    color: var(--plum-950);
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 6px 10px;
  }
  .demo-banner .sub {
    display: block;
    font-size: 9.5px;
    font-weight: 600;
    margin-top: 1px;
    opacity: 0.85;
  }

  /* ---------- Header ---------- */
  .topbar {
    background: var(--plum-800);
    color: var(--ivory);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--rose) 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    color: var(--plum-950);
    font-size: 15px;
  }
  .brand-name { font-family:'Source Serif 4', serif; font-size: 18px; font-weight: 600; line-height: 1.1; }
  .brand-sub { font-size: 11px; color: var(--plum-200); letter-spacing: 0.02em; }
  .avatar-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--plum-500);
    color: var(--ivory);
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Main scroll area ---------- */
  main { flex: 1; padding: 18px 18px 100px; overflow-y: auto; }

  .greeting { margin-bottom: 18px; }
  .greeting p { margin: 2px 0 0; color: var(--ink-muted); font-size: 14px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-card {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 12px;
  }
  .stat-card .num { font-family:'Source Serif 4', serif; font-size: 22px; font-weight: 700; color: var(--plum-800); }
  .stat-card .label { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

  .section-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 26px 0 12px;
  }
  .section-heading h2 { font-size: 17px; }
  .section-heading .link { font-size: 13px; color: var(--plum-700); font-weight: 600; }

  /* ---------- Visit cards ---------- */
  .visit-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--plum-700);
    border-radius: var(--radius-sm);
    padding: 14px 14px 12px;
    margin-bottom: 10px;
  }
  .visit-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .visit-provider { font-weight: 600; font-size: 14.5px; }
  .visit-date { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
  .status-pill {
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-approved { background: var(--sage-100); color: var(--sage); }
  .status-review { background: var(--amber-100); color: var(--amber); }
  .visit-reason { font-size: 13px; color: var(--plum-800); margin-top: 8px; font-weight: 500; }
  .visit-summary { font-size: 13px; color: var(--ink-muted); margin-top: 4px; line-height: 1.5; }
  .visit-meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11.5px; color: var(--plum-700); }
  .visit-meta-row span b { color: var(--plum-950); font-weight: 600; }
  .view-visit-btn {
    margin-top: 12px;
    display: inline-block;
    font-size: 12.5px; font-weight: 600;
    color: var(--plum-800);
    background: var(--plum-100);
    padding: 7px 14px;
    border-radius: 999px;
  }

  /* ---------- Generic list rows ---------- */
  .row-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 9px;
    display: flex; align-items: center; gap: 12px;
  }
  .row-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 600; }
  .row-sub { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
  .truncate-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Tasks ---------- */
  .task-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 9px;
  }
  .task-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .task-title { font-size: 14px; font-weight: 600; }
  .task-meta { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
  .task-overdue { color: var(--rose); font-weight: 600; }
  .status-select {
    margin-top: 10px; width: 100%;
    font-size: 12.5px; font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--ivory);
    color: var(--plum-950);
  }

  /* ---------- Family Village ---------- */
  .family-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 13px 14px; margin-bottom: 9px; display: flex; align-items: center; gap: 12px;
  }
  .family-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--plum-100); color: var(--plum-700);
    font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .role-badge {
    font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    background: var(--gold-100); color: #7A5A22;
  }
  .activity-item { font-size: 12.5px; color: var(--ink-muted); padding: 8px 0; border-top: 1px solid var(--line); }
  .activity-item:first-child { border-top: none; }
  .activity-item b { color: var(--plum-950); font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn-primary {
    background: var(--plum-800); color: var(--ivory);
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
    width: 100%; text-align: center;
  }
  .btn-secondary {
    background: var(--plum-100); color: var(--plum-800);
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
    width: 100%; text-align: center;
  }
  .fab {
    position: absolute;
    right: 20px; bottom: 92px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--plum-800); color: var(--ivory);
    font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(43,30,51,0.28);
  }

  /* ---------- Forms ---------- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--plum-800); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--paper);
    font-family: inherit; font-size: 14px; color: var(--plum-950);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .upload-box {
    display: block;
    width: 100%;
    border: 1.5px dashed var(--plum-500);
    background: var(--plum-100);
    border-radius: var(--radius-sm);
    padding: 20px 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--plum-700);
  }
  .divider-label {
    font-size: 11px; font-weight: 700; text-transform: none;
    color: var(--ink-muted);
    letter-spacing: 0.01em;
    margin: 20px 0 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Disclaimer ---------- */
  .disclaimer {
    background: var(--rose-100);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
    font-size: 12px;
    color: #7A4750;
    line-height: 1.5;
    display: flex; gap: 8px;
    margin: 10px 0 4px;
  }
  .disclaimer .mark { font-size: 15px; flex-shrink: 0; }

  .ai-summary-box {
    background: var(--plum-100);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--plum-950);
  }
  .ai-summary-label { font-size: 11px; font-weight: 700; color: var(--plum-700); margin-bottom: 6px; letter-spacing: 0.01em; }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 600;
    color: var(--ink-muted);
    padding: 6px 2px;
    border-radius: 10px;
    white-space: nowrap;
  }
  nav.tabbar button.active { color: var(--plum-800); background: var(--plum-100); }
  nav.tabbar .tab-icon { font-size: 18px; }

  /* ---------- Modal / detail overlay ---------- */
  .overlay {
    position: absolute; inset: 0;
    background: var(--ivory);
    display: flex; flex-direction: column;
    z-index: 10;
  }
  .overlay-header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; background: var(--plum-800); color: var(--ivory);
  }
  .overlay-header .back { font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .overlay-header .back-label { font-size: 14px; font-weight: 600; display: none; }
  .overlay-header h2 { font-size: 16px; color: var(--ivory); flex: 1; min-width: 0; }
  .overlay-close {
    font-size: 22px;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .overlay-close:hover { background: rgba(255,255,255,0.15); }
  .overlay-body { flex: 1; overflow-y: auto; padding: 18px; padding-bottom: 40px; }

  .badge-role {
    display: inline-block; font-size: 11px; font-weight: 600;
    color: var(--plum-200); background: rgba(255,255,255,0.12);
    padding: 3px 9px; border-radius: 999px; margin-top: 4px;
  }

  .lock-note {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--plum-100); border-radius: var(--radius-sm);
    padding: 12px 13px; font-size: 12px; color: var(--plum-700); line-height: 1.5;
    margin-top: 14px;
  }

  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .profile-item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; }
  .profile-item .k { font-size: 10.5px; color: var(--ink-muted); font-weight: 600; }
  .profile-item .v { font-size: 13.5px; font-weight: 600; margin-top: 2px; }

  .empty-note { font-size: 12.5px; color: var(--ink-muted); text-align: center; padding: 18px 10px; }
  .icon-btn {
    font-size: 15px;
    padding: 8px;
    border-radius: 8px;
    background: var(--plum-100);
    color: var(--plum-700);
    line-height: 1;
  }

  /* ---------- Cup Check ---------- */
  .cup-check-card {
    background: linear-gradient(160deg, var(--plum-100) 0%, var(--gold-100) 100%);
    border: 1px solid var(--plum-200);
    border-radius: var(--radius-md);
    padding: 20px 18px;
    margin-bottom: 24px;
  }
  .cup-check-card-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cup-visual { display: flex; justify-content: center; }
  .cup-outline {
    width: 90px; height: 110px;
    border: 3px solid var(--plum-700);
    border-radius: 0 0 20px 20px;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }
  .cup-fill {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, var(--gold) 0%, var(--plum-500) 100%);
    transition: height 0.3s ease;
  }
  .cup-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  .cup-option {
    flex: 1 1 28%;
    min-width: 84px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 6px;
    font-size: 12px; font-weight: 600; color: var(--plum-800);
  }
  .cup-option.selected {
    border-color: var(--plum-700);
    background: var(--plum-100);
  }

  /* ---------- CareGuide ---------- */
  .careguide-categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .careguide-category {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    font-size: 12px; font-weight: 600; color: var(--plum-800);
  }
  .resource-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 8px;
    color: var(--plum-800);
  }

  /* ---------- Prepare & Transition ---------- */
  .prepare-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .prepare-toggle button {
    flex: 1;
    padding: 10px 8px;
    border-radius: 999px;
    background: var(--plum-100);
    color: var(--plum-700);
    font-size: 12.5px; font-weight: 600;
    text-align: center;
  }
  .prepare-toggle button.active {
    background: var(--plum-800);
    color: var(--ivory);
  }

  @media (max-width: 380px) {
    main { padding: 14px 14px 100px; }
  }

  /* ---------- Desktop navigation ---------- */
  .desktop-nav {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
  }
  .desktop-nav > button {
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .desktop-nav > button:hover { background: var(--plum-100); }
  .desktop-nav > button.active { background: var(--plum-100); color: var(--plum-800); }
  .desktop-more { position: relative; margin-left: auto; }
  .desktop-more > button {
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .desktop-more > button:hover { background: var(--plum-100); }
  .desktop-more > button.active { background: var(--plum-100); color: var(--plum-800); }
  .desktop-more-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 30px rgba(43,30,51,0.18);
    min-width: 220px;
    padding: 6px;
  }
  .desktop-more-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--plum-800);
  }
  .desktop-more-menu button:hover { background: var(--plum-100); }

  @media (min-width: 860px) {
    #app { max-width: 760px; }
    .desktop-nav { display: flex; }
    nav.tabbar { display: none; }
    .overlay-header .back-label { display: inline; }
  }
</style>
</head>

// Escapes user-entered text before it is stored, so it can never be interpreted
// as HTML/script when later inserted into the page. Applied at the point of entry
// (in the form-handling functions below) rather than at every render call site.
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function matchCareGuideCategory(question) {
  const q = question.toLowerCase();
  if (/medic|dose|prescri|pharma|refill/.test(q)) return 'medications';
  if (/appointment|visit|doctor|provider/.test(q)) return 'appointment';
  if (/discharge|hospital|admit/.test(q)) return 'discharge';
  if (/talk|conversation|family|argu|resist/.test(q)) return 'conversations';
  if (/burnout|myself|stress|self-care|tired|overwhelm/.test(q)) return 'wellbeing';
  if (/chang|declin|worse|progress|more help/.test(q)) return 'changingneeds';
  return 'general';
}

function dmKey(a, b) {
  const names = [a, b].sort();
  return 'dm::' + names[0] + '::' + names[1];
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// Adds a text label next to every overlay's back arrow, and a visible × Close
// button (reusing the same action as the back button) — without needing to
// edit each of the ~20 individual overlay render functions by hand.
function decorateOverlay(html) {
  html = html.replace('←</button>', '←<span class="back-label">Back</span></button>');
  const match = html.match(/<button type="button" class="back" onclick="([^"]+)"/);
  const backAction = match ? match[1] : 'closeOverlay()';
  html = html.replace(
    /(<div class="overlay-header">[\s\S]*?<\/h2>)([\s\S]*?<\/div>)/,
    (full, beforeClose, afterH2) =>
      beforeClose + `<button type="button" class="overlay-close" onclick="${backAction}" aria-label="Close">×</button>` + afterH2
  );
  return html;
}

function renderOverlay() {
  if (state.overlay.type === 'visit') return renderVisitDetail(state.overlay.id);
  if (state.overlay.type === 'profile') return renderProfile();
  if (state.overlay.type === 'newVisit') return renderNewVisitForm();
  if (state.overlay.type === 'logDose') return renderLogDoseForm();
  if (state.overlay.type === 'inviteFamily') return renderInviteFamilyForm();
  if (state.overlay.type === 'chat') return renderChatOverlay(state.overlay.id);
  if (state.overlay.type === 'addMedication') return renderAddMedicationForm();
  if (state.overlay.type === 'newMessage') return renderNewMessageForm();
  if (state.overlay.type === 'villageMessages') return renderVillageMessagesOverlay();
  if (state.overlay.type === 'villageMembers') return renderVillageMembersOverlay();
  if (state.overlay.type === 'villageNotes') return renderVillageNotesOverlay();
  if (state.overlay.type === 'villageActivity') return renderVillageActivityOverlay();
  if (state.overlay.type === 'careHubSection') return renderCareHubSectionOverlay(state.overlay.id);
  if (state.overlay.type === 'careHubForm') return renderCareHubForm();
  if (state.overlay.type === 'careHubMedForm') return renderCareHubMedForm();
  if (state.overlay.type === 'careHubConditionForm') return renderCareHubConditionForm();
  return '';
}

function renderChatOverlay(key) {
  const msgs = state.messages[key] || [];
  let title;
  if (key === 'group') {
    title = 'Family Care Village';
  } else {
    const parts = key.split('::').slice(1);
    title = parts.find(n => n !== state.currentUser.name) || parts[0];
  }
  return `
    <div class="overlay">
      <div class="overlay-header">
        <button type="button" class="back" onclick="openOverlay('villageMessages')" aria-label="Back to Messages">←</button>
        <h2>${title}</h2>
      </div>
      <div class="overlay-body" id="chat-scroll" style="display:flex; flex-direction:column; gap:10px;">
        ${msgs.length ? msgs.map(m => `
          <div style="align-self:${m.sender===state.currentUser.name?'flex-end':'flex-start'}; max-width:78%;">
            ${key==='group' && m.sender!==state.currentUser.name ? `<div style="font-size:10.5px; color:var(--ink-muted); margin-bottom:2px;">${m.sender}</div>` : ''}
            <div style="background:${m.sender===state.currentUser.name?'var(--plum-800)':'var(--plum-100)'}; color:${m.sender===state.currentUser.name?'var(--ivory)':'var(--plum-950)'}; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.4;">${m.text}</div>
            <div style="font-size:10px; color:var(--ink-muted); margin-top:2px; text-align:${m.sender===state.currentUser.name?'right':'left'};">${m.time}</div>
          </div>
        `).join('') : '<p class="empty-note">No messages yet — say hello.</p>'}
      </div>
      <div style="display:flex; gap:8px; padding:12px 18px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--paper);">
        <input id="chat-input" type="text" placeholder="Message..." autocomplete="off" aria-label="Type a message"
          style="flex:1; padding:10px 14px; border-radius:20px; border:1px solid var(--line); font-family:inherit; font-size:14px;"
          onkeydown="if(event.key==='Enter'){sendMessage('${key}')}" />
        <button class="btn-primary" style="width:auto; padding:10px 20px; border-radius:20px;" onclick="sendMessage('${key}')">Send</button>
      </div>
    </div>
  `;
}

function renderVisitDetail(id) {
  const v = state.visits.find(x => x.id === id);
  if (!v) return '<div class="overlay"><div class="overlay-body">Visit not found.</div></div>';
  const caregiver = isPrimaryCaregiver();
  const tasksForVisit = linkedTasks(v.id);
  const tasksBlock = tasksForVisit.length ? `
    <div class="divider-label">Tasks from this Visit</div>
    ${tasksForVisit.map(t => `
      <div class="task-card">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">${t.assignee} · Due ${t.due} · ${t.status}</div>
      </div>
    `).join('')}
  ` : '';

  if (!caregiver && !v.shared) {
    return `
      <div class="overlay">
        <div class="overlay-header"><button type="button" class="back" onclick="closeOverlay()" aria-label="Back">←</button><h2>Visit Details</h2></div>
        <div class="overlay-body">
          <h1 style="font-size:19px;">${v.reason}</h1>
          <p style="color:var(--ink-muted); font-size:13px; margin-top:4px;">${v.provider}, ${v.specialty} · ${v.date}</p>
          <div class="ai-summary-box" style="background:var(--amber-100); color:#6B4E1E; margin-top:16px;">
            <div class="ai-summary-label" style="color:#7A5A22;">AWAITING CAREGIVER REVIEW</div>
            A caregiver is still reviewing this visit. You'll be notified as soon as it's shared with the Family Care Village.
          </div>
          ${tasksBlock}
        </div>
      </div>
    `;
  }

  return `
    <div class="overlay">
      <div class="overlay-header">
        <button type="button" class="back" onclick="closeOverlay()" aria-label="Back">←</button>
        <h2>Visit Details</h2>
      </div>
      <div class="overlay-body">
        <h1 style="font-size:19px;">${v.reason}</h1>
        <p style="color:var(--ink-muted); font-size:13px; margin-top:4px;">${v.provider}, ${v.specialty} · ${v.date}</p>
        <span class="status-pill ${v.shared ? 'status-approved' : 'status-review'}" style="margin-top:10px; display:inline-block;">
          ${v.shared ? 'Shared with Family' : (caregiver ? 'Caregiver review in progress' : 'Awaiting Review')}
        </span>

        ${caregiver ? renderCaregiverWorkflow(v) : renderSharedSummaryOnly(v)}
        ${tasksBlock}
      </div>
    </div>
  `;
}

function renderSharedSummaryOnly(v) {
  return `
    <div class="divider-label">Visit Notes Made Clear</div>
    <div class="disclaimer">
      <span class="mark">ⓘ</span>
      <span>This summary was written to make the visit easier to understand. It does not diagnose or recommend treatment changes, and it's been reviewed and approved by a caregiver.</span>
    </div>
    <div class="ai-summary-box">
      <div class="ai-summary-label">APPROVED SUMMARY</div>
      ${v.aiSummary}
    </div>

    <div class="divider-label">Medication Changes</div>
    ${v.draftMedChanges.length ? v.draftMedChanges.map(m => `
      <div class="row-card"><div class="row-main"><div class="row-title">${m.name}</div><div class="row-sub">${m.change}</div></div></div>
    `).join('') : '<p class="empty-note">No medication changes from this visit.</p>'}
  `;
}

function renderCaregiverWorkflow(v) {
  const hasDraft = !!v.aiSummary;
  return `
    <div class="divider-label">Notes &amp; Documents</div>
    ${v.documents.length ? v.documents.map(d => `
      <div class="row-card">
        <div class="row-icon" style="background:var(--plum-100); color:var(--plum-700);">${d.kind==='image'?'🖼️':(d.kind==='pdf'?'📄':'📝')}</div>
        <div class="row-main"><div class="row-title">${d.name}</div><div class="row-sub">${d.kind==='image'?'Photo':(d.kind==='pdf'?'PDF document':'Text note')}</div></div>
      </div>
    `).join('') : '<p class="empty-note">No documents uploaded yet.</p>'}
    <input type="file" id="file-${v.id}" style="display:none" multiple accept="image/*,application/pdf,text/plain" onchange="handleFileUpload('${v.id}', this)" />
    <button type="button" class="upload-box" onclick="document.getElementById('file-${v.id}').click()">📎 Tap to take a photo or upload visit notes / discharge paperwork<br><span style="font-size:10.5px;">Demo only — do not upload real documents. Nothing is transmitted, analyzed, or stored; the file stays in your browser for this session only.</span></button>

    <div class="field" style="margin-top:14px;">
      <label for="notes-${v.id}">Your notes (caregiver)</label>
      <textarea id="notes-${v.id}" placeholder="What happened at the visit, in your own words...">${v.caregiverNotes}</textarea>
    </div>
    <button class="btn-secondary" onclick="saveCaregiverNotes('${v.id}')">Save Notes</button>

    <div class="divider-label">Visit Notes Made Clear</div>
    <div class="disclaimer">
      <span class="mark">ⓘ</span>
      <span>This summary is meant to help make visit notes easier to read. It does not diagnose, does not recommend treatment changes, and is not a substitute for the provider's own instructions. In this static prototype, the draft below is a <b>simulated placeholder</b> — no live AI service is called and no data leaves your browser.</span>
    </div>

    ${v.error ? `<p style="color:var(--rose); font-size:12.5px; margin-bottom:8px;">${v.error}</p>` : ''}

    ${!hasDraft ? `
      <button class="btn-primary" ${v.generating ? 'disabled' : ''} onclick="generateDraft('${v.id}')">
        ${v.generating ? 'Generating draft…' : 'Generate Plain-Language Draft'}
      </button>
    ` : (v.approved ? `
      <div class="ai-summary-box">
        <div class="ai-summary-label">APPROVED SUMMARY</div>
        ${v.aiSummary}
      </div>
    ` : `
      <div class="field">
        <label for="draft-${v.id}">Draft summary — edit as needed before approving</label>
        <textarea id="draft-${v.id}" rows="5">${v.aiSummary}</textarea>
      </div>
      <button class="btn-secondary" ${v.generating ? 'disabled' : ''} onclick="generateDraft('${v.id}')">${v.generating ? 'Regenerating…' : 'Regenerate Draft'}</button>
      <button class="btn-primary" style="margin-top:10px;" onclick="approveDraft('${v.id}')">Approve Summary</button>
    `)}

    ${hasDraft ? renderMedChangesSection(v) : ''}
    ${hasDraft ? renderFollowUpsSection(v) : ''}

    ${(v.approved && v.medChangesConfirmed) ? `
      <div class="divider-label">Share with Family</div>
      ${v.shared ? `
        <div class="ai-summary-box" style="background:var(--sage-100); color:#3E5A43;">
          ✓ Shared with the Family Care Village — the approved summary, confirmed medication changes, and any tasks are now visible to Family Care Village members.
        </div>
      ` : `
        <p style="font-size:12.5px; color:var(--ink-muted); margin-bottom:10px;">Only what's approved and confirmed above will become visible to Family Care Village members.</p>
        <button class="btn-primary" onclick="shareVisit('${v.id}')">Share with Family Care Village</button>
      `}
    ` : ''}
  `;
}

function renderMedChangesSection(v) {
  if (v.medChangesConfirmed) {
    return `
      <div class="divider-label">Medication Changes — Confirmed</div>
      ${v.draftMedChanges.length ? v.draftMedChanges.map(m => `
        <div class="row-card"><div class="row-main"><div class="row-title">${m.name}</div><div class="row-sub">${m.change}</div></div></div>
      `).join('') : '<p class="empty-note">No medication changes from this visit.</p>'}
    `;
  }
  if (!v.draftMedChanges.length) {
    return `
      <div class="divider-label">Medication Changes</div>

// Step 1: create and save an appointment
function saveNewVisit() {
  const provider = escapeHtml(document.getElementById('nv-provider').value.trim());
  const specialty = escapeHtml(document.getElementById('nv-specialty').value.trim());
  const date = document.getElementById('nv-date').value;
  const reason = escapeHtml(document.getElementById('nv-reason').value.trim());
  const followUpNote = escapeHtml(document.getElementById('nv-followup').value.trim());

  if (!provider || !reason || !date) {
    alert('Please fill in at least the provider, date, and reason for the visit.');
    return;
  }

  const id = 'v' + state.nextVisitId++;
  state.visits.push({
    id, provider, specialty: specialty || 'General', date: formatDate(date),
    reason, caregiverNotes: '', documents: [],
    aiSummary: null, draftMedChanges: [], draftFollowUps: [],
    medChangesConfirmed: false, approved: false, shared: false,
    followUpNote: followUpNote || '—', generating: false, error: null,
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> saved a new visit with ${provider}`);
  openOverlay('visit', id);
}

// Step 2: upload notes or discharge paperwork
function handleFileUpload(id, inputEl) {
  const files = Array.from(inputEl.files || []);
  files.forEach(file => {
    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        addDocument(id, { name: file.name, kind: 'image', mediaType: file.type, data: base64 });
      };
      reader.readAsDataURL(file);
    } else if (file.type === 'application/pdf') {
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        addDocument(id, { name: file.name, kind: 'pdf', data: base64 });
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = () => {
        addDocument(id, { name: file.name, kind: 'text', data: String(reader.result).slice(0, 6000) });
      };
      reader.readAsText(file);
    }
  });
}
function addDocument(id, doc) {
  const v = state.visits.find(x => x.id === id);
  if (v) v.documents.push(doc);
  openOverlay('visit', id);
}

function saveCaregiverNotes(id) {
  const v = state.visits.find(x => x.id === id);
  const el = document.getElementById('notes-' + id);
  if (v && el) v.caregiverNotes = escapeHtml(el.value);
  openOverlay('visit', id);
}

// Step 3: generate a plain-language draft
function generateDraft(id) {
  // STATIC DEMO ONLY: this prototype does not call any live AI service.
  // No network request is made and no API key is present anywhere in this file.
  const v = state.visits.find(x => x.id === id);
  if (!v) return;
  if (!v.caregiverNotes.trim() && v.documents.length === 0) {
    v.error = 'Add your notes or upload a document before generating a draft.';
    openOverlay('visit', id);
    return;
  }
  v.error = null;
  v.generating = true;
  openOverlay('visit', id);

  // Brief delay only to preserve the loading-state UX — no network call happens here.
  setTimeout(() => {
    const noteExcerpt = v.caregiverNotes ? v.caregiverNotes.trim().slice(0, 200) : null;
    v.aiSummary = `[Simulated demo output — no live AI service was called] This is a placeholder plain-language draft for the ${v.reason} visit with ${v.provider}. ${noteExcerpt ? `Your notes were: "${noteExcerpt}${v.caregiverNotes.length > 200 ? '…' : ''}"` : 'No caregiver notes were entered, so this text is a static example.'} In a connected version of this app, this section would contain an AI-written summary of the visit for caregiver review.`;
    v.draftMedChanges = [
      { id: `${v.id}-mc0`, name: 'Example Medication', change: 'Sample change description — static demo placeholder, not extracted from real data', checked: true },
    ];
    v.draftFollowUps = [
      { id: `${v.id}-fu0`, description: 'Example follow-up action — static demo placeholder', timeframe: '2 weeks', assignee: familyMembers[0], dueDate: '', selected: true, taskCreated: false },
    ];
    v.approved = false;
    v.medChangesConfirmed = false;
    v.shared = false;
    v.generating = false;
    openOverlay('visit', id);
  }, 500);
}

// Step 4: caregiver corrects and approves the draft
function approveDraft(id) {
  const v = state.visits.find(x => x.id === id);
  const el = document.getElementById('draft-' + id);
  if (v && el) v.aiSummary = escapeHtml(el.value);
  if (v) v.approved = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> approved the visit summary for ${v.date}`);
  openOverlay('visit', id);
}

// Step 5: confirm extracted medication changes
function toggleMedChange(id, i, checked) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges[i].checked = checked;
}
function editMedChange(id, i, field, value) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges[i][field] = escapeHtml(value);
}
function confirmMedChanges(id) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges = v.draftMedChanges.filter(m => m.checked !== false);
  v.medChangesConfirmed = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> confirmed medication changes for the ${v.date} visit`);
  openOverlay('visit', id);
}

// Step 6: convert follow-up instructions into tasks
function toggleFollowUp(id, i, checked) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps[i].selected = checked;
}
function editFollowUp(id, i, field, value) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps[i][field] = value;
}
function createTasksFromFollowUps(id) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps.forEach(f => {
    if (f.selected === false || f.taskCreated) return;
    const taskId = 't' + state.nextTaskId++;
    state.tasks.push({
      id: taskId,
      title: f.description,
      assignee: f.assignee,
      due: f.dueDate ? formatDate(f.dueDate) : (f.timeframe || 'No date set'),
      status: 'Not started',
      linkedVisit: v.id,
      overdue: false,
    });
    f.taskCreated = true;
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> created follow-up tasks from the ${v.date} visit`);
  openOverlay('visit', id);
}

// Step 7: share only approved information with the Family Care Village
function shareVisit(id) {
  const v = state.visits.find(x => x.id === id);
  v.shared = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> shared the ${v.date} visit with the Family Care Village`);
  openOverlay('visit', id);
}

document.addEventListener('click', function (e) {
  if (state.desktopMoreOpen && e.target && e.target.closest && !e.target.closest('.desktop-more')) {
    state.desktopMoreOpen = false;
    render();
  }
});

render();

</script>
</body>
</html>
