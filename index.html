<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ Legacy Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-950: #2B1E33;
    --plum-800: #3D2645;
    --plum-700: #4A2C5E;
    --plum-500: #6E4A82;
    --plum-200: #E4D9EA;
    --plum-100: #F1EAF4;
    --ivory: #FAF7F4;
    --paper: #FFFFFF;
    --gold: #B8935A;
    --gold-100: #F5EBDA;
    --rose: #A14550;
    --rose-100: #F7E6E8;
    --sage: #4C6F52;
    --sage-100: #E7EFE8;
    --amber: #8A5F1E;
    --amber-100: #FAF0DF;
    --ink-muted: #6E6277;
    --cup-liquid: #6E3FA3;
    --line: #E5DDE9;
    --radius-sm: 8px;
    --radius-md: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Public Sans', -apple-system, sans-serif;
    background: var(--ivory);
    color: var(--plum-950);
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .serif {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    margin: 0;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    text-align: inherit;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    margin: 0;
  }
  button:disabled { opacity: 0.55; cursor: default; }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--plum-700);
    outline-offset: 2px;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--ivory);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 40px rgba(43,30,51,0.08);
  }

  /* ---------- Demo banner ---------- */
  .demo-banner {
    position: relative;
    z-index: 20;
    background: var(--gold);
    color: var(--plum-950);
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 6px 10px;
  }
  .demo-banner .sub {
    display: block;
    font-size: 9.5px;
    font-weight: 600;
    margin-top: 1px;
    opacity: 0.85;
  }

  /* ---------- Header ---------- */
  .topbar {
    background: var(--plum-800);
    color: var(--ivory);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold) 0%, var(--rose) 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    color: var(--plum-950);
    font-size: 15px;
  }
  .brand-name { font-family:'Source Serif 4', serif; font-size: 18px; font-weight: 600; line-height: 1.1; }
  .brand-sub { font-size: 11px; color: var(--plum-200); letter-spacing: 0.02em; }
  .avatar-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--plum-500);
    color: var(--ivory);
    font-weight: 600;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- Main scroll area ---------- */
  main { flex: 1; padding: 18px 18px 100px; overflow-y: auto; }

  .greeting { margin-bottom: 18px; }
  .greeting p { margin: 2px 0 0; color: var(--ink-muted); font-size: 14px; }

  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-card {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 12px;
  }
  .stat-card .num { font-family:'Source Serif 4', serif; font-size: 22px; font-weight: 700; color: var(--plum-800); }
  .stat-card .label { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

  .section-heading {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 26px 0 12px;
  }
  .section-heading h2 { font-size: 17px; }
  .section-heading .link { font-size: 13px; color: var(--plum-700); font-weight: 600; }

  /* ---------- Visit cards ---------- */
  .visit-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--plum-700);
    border-radius: var(--radius-sm);
    padding: 14px 14px 12px;
    margin-bottom: 10px;
  }
  .visit-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .visit-provider { font-weight: 600; font-size: 14.5px; }
  .visit-date { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
  .status-pill {
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-approved { background: var(--sage-100); color: var(--sage); }
  .status-review { background: var(--amber-100); color: var(--amber); }
  .visit-reason { font-size: 13px; color: var(--plum-800); margin-top: 8px; font-weight: 500; }
  .visit-summary { font-size: 13px; color: var(--ink-muted); margin-top: 4px; line-height: 1.5; }
  .visit-meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 11.5px; color: var(--plum-700); }
  .visit-meta-row span b { color: var(--plum-950); font-weight: 600; }
  .view-visit-btn {
    margin-top: 12px;
    display: inline-block;
    font-size: 12.5px; font-weight: 600;
    color: var(--plum-800);
    background: var(--plum-100);
    padding: 7px 14px;
    border-radius: 999px;
  }

  /* ---------- Generic list rows ---------- */
  .row-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 9px;
    display: flex; align-items: center; gap: 12px;
  }
  .row-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 600; }
  .row-sub { font-size: 12px; color: var(--ink-muted); margin-top: 1px; }
  .truncate-line { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Tasks ---------- */
  .task-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom: 9px;
  }
  .task-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .task-title { font-size: 14px; font-weight: 600; }
  .task-meta { font-size: 12px; color: var(--ink-muted); margin-top: 4px; }
  .task-overdue { color: var(--rose); font-weight: 600; }
  .status-select {
    margin-top: 10px; width: 100%;
    font-size: 12.5px; font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--ivory);
    color: var(--plum-950);
  }

  /* ---------- Family Village ---------- */
  .family-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 13px 14px; margin-bottom: 9px; display: flex; align-items: center; gap: 12px;
  }
  .family-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--plum-100); color: var(--plum-700);
    font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .role-badge {
    font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
    background: var(--gold-100); color: #7A5A22;
  }
  .activity-item { font-size: 12.5px; color: var(--ink-muted); padding: 8px 0; border-top: 1px solid var(--line); }
  .activity-item:first-child { border-top: none; }
  .activity-item b { color: var(--plum-950); font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn-primary {
    background: var(--plum-800); color: var(--ivory);
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
    width: 100%; text-align: center;
  }
  .btn-secondary {
    background: var(--plum-100); color: var(--plum-800);
    padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 14px;
    width: 100%; text-align: center;
  }
  .fab {
    position: absolute;
    right: 20px; bottom: 92px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--plum-800); color: var(--ivory);
    font-size: 26px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(43,30,51,0.28);
  }

  /* ---------- Forms ---------- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--plum-800); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--paper);
    font-family: inherit; font-size: 14px; color: var(--plum-950);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .upload-box {
    display: block;
    width: 100%;
    border: 1.5px dashed var(--plum-500);
    background: var(--plum-100);
    border-radius: var(--radius-sm);
    padding: 20px 14px;
    text-align: center;
    font-size: 12.5px;
    color: var(--plum-700);
  }
  .divider-label {
    font-size: 11px; font-weight: 700; text-transform: none;
    color: var(--ink-muted);
    letter-spacing: 0.01em;
    margin: 20px 0 10px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Disclaimer ---------- */
  .disclaimer {
    background: var(--rose-100);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
    font-size: 12px;
    color: #7A4750;
    line-height: 1.5;
    display: flex; gap: 8px;
    margin: 10px 0 4px;
  }
  .disclaimer .mark { font-size: 15px; flex-shrink: 0; }

  .ai-summary-box {
    background: var(--plum-100);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--plum-950);
  }
  .ai-summary-label { font-size: 11px; font-weight: 700; color: var(--plum-700); margin-bottom: 6px; letter-spacing: 0.01em; }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    position: sticky; bottom: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10.5px; font-weight: 600;
    color: var(--ink-muted);
    padding: 6px 2px;
    border-radius: 10px;
    white-space: nowrap;
  }
  nav.tabbar button.active { color: var(--plum-800); background: var(--plum-100); }
  nav.tabbar .tab-icon { font-size: 18px; }

  /* ---------- Modal / detail overlay ---------- */
  .overlay {
    position: absolute; inset: 0;
    background: var(--ivory);
    display: flex; flex-direction: column;
    z-index: 10;
  }
  .overlay-header {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px; background: var(--plum-800); color: var(--ivory);
  }
  .overlay-header .back { font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .overlay-header .back-label { font-size: 14px; font-weight: 600; display: none; }
  .overlay-header h2 { font-size: 16px; color: var(--ivory); flex: 1; min-width: 0; }
  .overlay-close {
    font-size: 22px;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .overlay-close:hover { background: rgba(255,255,255,0.15); }
  .overlay-body { flex: 1; overflow-y: auto; padding: 18px; padding-bottom: 40px; }

  .badge-role {
    display: inline-block; font-size: 11px; font-weight: 600;
    color: var(--plum-200); background: rgba(255,255,255,0.12);
    padding: 3px 9px; border-radius: 999px; margin-top: 4px;
  }

  .lock-note {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--plum-100); border-radius: var(--radius-sm);
    padding: 12px 13px; font-size: 12px; color: var(--plum-700); line-height: 1.5;
    margin-top: 14px;
  }

  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .profile-item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; }
  .profile-item .k { font-size: 10.5px; color: var(--ink-muted); font-weight: 600; }
  .profile-item .v { font-size: 13.5px; font-weight: 600; margin-top: 2px; }

  .empty-note { font-size: 12.5px; color: var(--ink-muted); text-align: center; padding: 18px 10px; }
  .icon-btn {
    font-size: 15px;
    padding: 8px;
    border-radius: 8px;
    background: var(--plum-100);
    color: var(--plum-700);
    line-height: 1;
  }

  /* ---------- Cup Check ---------- */
  .cup-check-card {
    background: linear-gradient(160deg, var(--plum-100) 0%, var(--gold-100) 100%);
    border: 1px solid var(--plum-200);
    border-radius: var(--radius-md);
    padding: 22px 18px;
    margin-bottom: 24px;
  }
  .cup-check-heading {
    margin: 0;
  }
  .cup-check-tagline {
    font-size: 13px;
    font-weight: 600;
    color: var(--plum-700);
    margin: 4px 0 0;
  }
  .cup-check-prompt {
    font-size: 14.5px;
    color: var(--plum-950);
    margin: 12px 0 0;
  }
  .cup-check-note {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.55;
    margin: 6px 0 0;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .cup-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }
  .cup-option {
    flex: 1 1 28%;
    min-width: 90px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 12px 6px 10px;
    font-size: 12px; font-weight: 600; color: var(--plum-800);
  }
  .cup-option:hover { border-color: var(--plum-500); background: var(--ivory); }
  .cup-option.selected {
    border-color: var(--plum-700);
    border-width: 2px;
    background: var(--plum-100);
  }

  /* ---------- CareGuide ---------- */
  .careguide-categories {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .careguide-category {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 14px 8px;
    font-size: 12px; font-weight: 600; color: var(--plum-800);
  }
  .resource-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gold);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 8px;
    color: var(--plum-800);
  }

  /* ---------- Changing Care Needs ---------- */
  .prepare-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .prepare-toggle button {
    flex: 1;
    padding: 10px 8px;
    border-radius: 999px;
    background: var(--plum-100);
    color: var(--plum-700);
    font-size: 12.5px; font-weight: 600;
    text-align: center;
  }
  .prepare-toggle button.active {
    background: var(--plum-800);
    color: var(--ivory);
  }

  /* ===== Care Transition feature: BEGIN (CSS) =====
     Reuses existing color tokens, radii, and type scale only — no new
     palette or visual style introduced. */
  .care-transition-progress {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }
  .care-transition-progress span {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 10px;
  }
  .care-transition-progress span.active {
    background: var(--plum-800);
    color: var(--ivory);
    border-color: var(--plum-800);
  }
  .care-transition-exit-link {
    display: block;
    text-align: right;
    font-size: 12px;
    font-weight: 600;
    color: var(--plum-700);
    margin: -6px 0 14px;
  }
  /* ===== Care Transition feature: END (CSS) ===== */

  @media (max-width: 380px) {
    main { padding: 14px 14px 100px; }
  }

  /* ---------- Desktop navigation ---------- */
  .desktop-nav {
    display: none;
    align-items: center;
    gap: 4px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
  }
  .desktop-nav > button {
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .desktop-nav > button:hover { background: var(--plum-100); }
  .desktop-nav > button.active { background: var(--plum-100); color: var(--plum-800); }
  .desktop-more { position: relative; margin-left: auto; }
  .desktop-more > button {
    padding: 9px 14px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .desktop-more > button:hover { background: var(--plum-100); }
  .desktop-more > button.active { background: var(--plum-100); color: var(--plum-800); }
  .desktop-more-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    box-shadow: 0 10px 30px rgba(43,30,51,0.18);
    min-width: 220px;
    padding: 6px;
  }
  .desktop-more-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--plum-800);
  }
  .desktop-more-menu button:hover { background: var(--plum-100); }

  /* Tablet: wider reading column, but still the touch-friendly bottom nav —
     desktop nav needs more horizontal room than tablets have, so it only
     switches on at the true desktop breakpoint below. */
  @media (min-width: 600px) and (max-width: 859px) {
    #app { max-width: 640px; }
  }

  @media (min-width: 860px) {
    #app { max-width: 760px; }
    .desktop-nav { display: flex; }
    nav.tabbar { display: none; }
    .overlay-header .back-label { display: inline; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>

// Escapes user-entered text before it is stored, so it can never be interpreted
// as HTML/script when later inserted into the page. Applied at the point of entry
// (in the form-handling functions below) rather than at every render call site.
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// One consistent, elegant cup outline used for every level — only the fill
// height changes. No emoji, no cartoon faces, no per-level shape changes.
function renderCupSVG(fillPct, idSuffix, size) {
  const w = size || 44;
  const h = Math.round(w * 1.15);
  const clipId = 'cupclip-' + idSuffix;
  const rimY = 20, baseY = 44;
  const fraction = Math.max(0, Math.min(1, fillPct / 100));
  const fillTopY = baseY - fraction * (baseY - rimY);
  const rimIsFull = fraction >= 0.82;
  const bodyPath = 'M16,20 L44,20 C44,32 42,40 39,44 L21,44 C18,40 16,32 16,20 Z';
  return `
    <svg viewBox="0 0 60 58" width="${w}" height="${h}" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="${clipId}"><path d="${bodyPath}" /></clipPath>
      </defs>
      <ellipse cx="30" cy="51" rx="24" ry="5.5" fill="#FFFFFF" stroke="var(--gold)" stroke-width="1.2" />
      <path d="${bodyPath}" fill="#FFFFFF" stroke="var(--gold)" stroke-width="1.3" />
      <rect x="14" y="${fillTopY}" width="32" height="${baseY + 6 - fillTopY}" fill="var(--cup-liquid)" clip-path="url(#${clipId})" />
      <path d="M43,25 C52,25 52,39 43,39" fill="none" stroke="var(--gold)" stroke-width="2.3" stroke-linecap="round" />
      <ellipse cx="30" cy="44" rx="7" ry="1.8" fill="#FFFFFF" stroke="var(--gold)" stroke-width="1" />
      <ellipse cx="30" cy="20" rx="14" ry="4" fill="${rimIsFull ? 'var(--cup-liquid)' : '#FFFFFF'}" stroke="var(--gold)" stroke-width="1.3" />
    </svg>
  `;
}

function matchCareGuideCategory(question) {
  const q = question.toLowerCase();
  if (/medic|dose|prescri|pharma|refill/.test(q)) return 'medications';
  if (/appointment|visit|doctor|provider/.test(q)) return 'appointment';
  if (/discharge|hospital|admit/.test(q)) return 'discharge';
  if (/talk|conversation|family|argu|resist/.test(q)) return 'conversations';
  if (/burnout|myself|stress|self-care|tired|overwhelm/.test(q)) return 'wellbeing';
  if (/chang|declin|worse|progress|more help/.test(q)) return 'changingneeds';
  return 'general';
}

function linkedTasks(visitId) { return state.tasks.filter(t => t.linkedVisit === visitId); }

function logActivity(text) { state.activity.unshift({ text, time: 'Just now' }); }
function dmKey(a, b) {
  const names = [a, b].sort();
  return 'dm::' + names[0] + '::' + names[1];
}
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// Adds a text label next to every overlay's back arrow, and a visible × Close
// button (reusing the same action as the back button) — without needing to
// edit each of the ~20 individual overlay render functions by hand.
function decorateOverlay(html) {
  html = html.replace('←</button>', '←<span class="back-label">Back</span></button>');
  const match = html.match(/<button type="button" class="back" onclick="([^"]+)"/);
  const backAction = match ? match[1] : 'closeOverlay()';
  html = html.replace(
    /(<div class="overlay-header">[\s\S]*?<\/h2>)([\s\S]*?<\/div>)/,
    (full, beforeClose, afterH2) =>
      beforeClose + `<button type="button" class="overlay-close" onclick="${backAction}" aria-label="Close">×</button>` + afterH2
  );
  return html;
}

function renderVisitCard(v) {
  const restricted = !v.shared && !isPrimaryCaregiver();
  const openTasks = openTaskCount(v.id);
  const statusLabel = v.shared ? 'Approved' : (isPrimaryCaregiver() ? (v.approved ? 'Approving in progress' : 'Awaiting Review') : 'Awaiting Review');
  return `
    <div class="visit-card">
      <div class="visit-card-top">
        <div>
          <div class="visit-provider">${v.provider}</div>
          <div class="visit-date">${v.specialty} · ${v.date}</div>
        </div>
        <span class="status-pill ${v.shared ? 'status-approved' : 'status-review'}">${statusLabel}</span>
      </div>
      <div class="visit-reason">${v.reason}</div>
      <div class="visit-summary">
        ${v.shared
          ? v.aiSummary
          : (restricted
              ? 'A caregiver is reviewing this visit. Details will appear here once it\'s shared.'
              : (v.aiSummary ? 'Draft ready — open this visit to review and approve it.' : 'No draft yet — open this visit to get started.'))}
      </div>
      ${!restricted ? `
      <div class="visit-meta-row">
        <span><b>Med changes:</b> ${v.medChangesConfirmed ? (v.draftMedChanges.map(m=>m.name).join(', ') || 'None') : 'Pending confirmation'}</span>
        <span><b>Follow-up:</b> ${v.followUpNote || '—'}</span>
        <span><b>Open tasks:</b> ${openTasks}</span>
      </div>` : ''}
      <button type="button" class="view-visit-btn" onclick="openOverlay('visit', '${v.id}')">View Visit →</button>
    </div>
  `;
}

function renderTasks() {
  const pending = state.tasks.filter(t => t.source === 'suggested' && !t.confirmed);
  const active = state.tasks.filter(t => !(t.source === 'suggested' && !t.confirmed));
  const sorted = active.slice().sort((a,b) => (a.overdue===b.overdue)?0:(a.overdue?-1:1));
  return `
    <div class="greeting"><h1>Tasks</h1><p>Anyone in the Family Care Village can update a task's status.</p></div>
    <p style="font-size:11.5px; color:var(--ink-muted); margin-top:-10px; margin-bottom:16px;">Demo only — "notifying" language below is illustrative. No real emails, texts, or push alerts are sent by this prototype.</p>

    ${pending.length ? `
      <div class="section-heading"><h2>Suggested Tasks</h2></div>
      <p style="font-size:11.5px; color:var(--ink-muted); margin-top:-10px; margin-bottom:12px;">These came from elsewhere in the app (like a visit) and aren't active yet — review and accept them, or dismiss what you don't need.</p>
      ${pending.map(t => `
        <div class="task-card" style="border-left:3px solid var(--amber);">
          <div class="task-top">
            <div class="task-title">${t.title}</div>
            <span class="status-pill status-review">Suggested</span>
          </div>
          <div class="task-meta">
            ${t.assignee && t.assignee !== 'Unassigned' ? `Suggested for ${t.assignee}` : 'Not yet assigned'}${t.due ? ' · Due ' + t.due : ''}${t.linkedVisit ? ' · From a recent visit' : ''}
          </div>
          ${t.notes ? `<p style="font-size:12.5px; color:var(--ink-muted); margin-top:6px; font-style:italic;">${t.notes}</p>` : ''}
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button type="button" class="btn-primary" style="flex:1;" onclick="acceptSuggestedTask('${t.id}')">Accept</button>
            <button type="button" class="btn-secondary" style="flex:1;" onclick="dismissSuggestedTask('${t.id}')">Dismiss</button>
          </div>
        </div>

      <div class="row-card" style="display:block;">

    <div class="field"><label for="ocp-mobility">Mobility and home safety</label><textarea id="ocp-mobility" oninput="updateOngoingCarePlanSupportField('mobilitySafety', this.value)">${p.support.mobilitySafety}</textarea></div>
    <div class="field"><label for="ocp-medsupport">Medication support</label><textarea id="ocp-medsupport" oninput="updateOngoingCarePlanSupportField('medicationSupport', this.value)">${p.support.medicationSupport}</textarea></div>
    <div class="field"><label for="ocp-meals">Meals and nutrition</label><textarea id="ocp-meals" oninput="updateOngoingCarePlanSupportField('mealsNutrition', this.value)">${p.support.mealsNutrition}</textarea></div>
    <div class="field"><label for="ocp-transport">Transportation and appointments</label><textarea id="ocp-transport" oninput="updateOngoingCarePlanSupportField('transportation', this.value)">${p.support.transportation}</textarea></div>
    <div class="field"><label for="ocp-emotional">Emotional and social well-being</label><textarea id="ocp-emotional" oninput="updateOngoingCarePlanSupportField('emotionalSocial', this.value)">${p.support.emotionalSocial}</textarea></div>
    <div class="field"><label for="ocp-other">Other support needs</label><textarea id="ocp-other" oninput="updateOngoingCarePlanSupportField('other', this.value)">${p.support.other}</textarea></div>

    <div class="field"><label for="ocp-caregiversupport">Support the primary caregiver needs</label><textarea id="ocp-caregiversupport" oninput="updateOngoingCarePlanField('caregiverSupport', this.value)">${p.caregiverSupport}</textarea></div>

      <div class="task-card">

// ===== Care Transition feature: BEGIN (render functions) =====
// Everything below renders the "Start a Care Transition" guided workflow.
// It is opened as its own overlay ('careTransitionWizard') and does not
// alter how any existing overlay, tab, or form renders.

function renderCareTransitionProgress() {
  const steps = ['Add Information', 'Review Summary', 'Create Plan', 'Coordinate Village'];
  const current = state.careTransition.step;
  return `
    <div class="care-transition-progress" role="group" aria-label="Care Transition progress">
      ${steps.map((label, i) => `<span class="${current === i + 1 ? 'active' : ''}">${i + 1}. ${label}</span>`).join('')}
    </div>
  `;
}

function renderCareTransitionWizard() {
  const step = state.careTransition.step;
  let body = '';
  if (step === 1) body = renderCareTransitionStep1();
  else if (step === 2) body = renderCareTransitionStep2();
  else if (step === 3) body = renderCareTransitionStep3();
  else body = renderCareTransitionStep4();

  return `
    <div class="overlay">
      <div class="overlay-header">
        <button type="button" class="back" onclick="careTransitionBack()" aria-label="Back">←</button>
        <h2>Care Transition</h2>
      </div>
      <div class="overlay-body">
        ${renderCareTransitionProgress()}
        <button type="button" class="care-transition-exit-link" onclick="careTransitionExit()">Exit to Preparing for Changing Care Needs</button>
        ${body}
      </div>
    </div>
  `;
}

function renderCareTransitionStep1() {
  const ct = state.careTransition;
  return `
    <h1 style="font-size:18px;">${ct.scenario}</h1>
    <p style="font-size:12.5px; color:var(--ink-muted); margin-top:4px; line-height:1.5;">Add discharge information to get started. This is the only transition scenario in this prototype.</p>

    <div class="disclaimer" style="margin-top:14px;">
      <span class="mark">ⓘ</span>
      <span>Prototype demonstration: This feature uses fictional information to demonstrate how discharge instructions could be organized. It does not provide medical advice. Do not upload real medical documents.</span>
    </div>

    ${ct.processing ? `
      <div class="ai-summary-box" style="text-align:center; margin-top:20px;">Reading your discharge information…</div>
      <p class="empty-note">This is a simulated demo step — no real image recognition or document processing is happening.</p>
    ` : `
      <input type="file" id="care-transition-photo-input" style="display:none" accept="image/*" capture="environment" onchange="careTransitionFileSelected(this)" />
      <button type="button" class="btn-secondary" style="margin-top:14px;" onclick="document.getElementById('care-transition-photo-input').click()">📷 Take a Photo</button>

      <input type="file" id="care-transition-document-input" style="display:none" accept="image/*,application/pdf,text/plain" onchange="careTransitionFileSelected(this)" />
      <button type="button" class="btn-secondary" style="margin-top:8px;" onclick="document.getElementById('care-transition-document-input').click()">📎 Upload a Document</button>

      <div class="field" style="margin-top:14px;">
        <label for="care-transition-manual-notes">Enter information manually <span style="font-weight:400; color:var(--ink-muted);">(optional)</span></label>
        <textarea id="care-transition-manual-notes" placeholder="Type any discharge details you'd like to note...">${ct.manualNotes}</textarea>
      </div>
      <button type="button" class="btn-secondary" onclick="careTransitionContinueManual()">Continue with Manual Entry</button>

      <div class="divider-label">Or</div>
      <button type="button" class="btn-primary" onclick="careTransitionUseSample()">Use Sample Discharge Information</button>
    `}
  `;
}

function renderCareTransitionStep2() {
  const ct = state.careTransition;
  const visibleItems = ct.summaryItems.filter(i => !i.removed);
  return `
    <h1 style="font-size:18px;">Review the Transition Summary</h1>
    <span class="status-pill status-review" style="margin-top:8px; display:inline-block;">AI-organized sample — caregiver review required</span>
    <p style="font-size:12px; color:var(--ink-muted); margin-top:10px; line-height:1.5;">Nothing below is approved automatically. Review each item, then Confirm, Edit, Remove, or ask for clarification.</p>

    ${visibleItems.map(item => `
      <div class="row-card" style="display:block;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
          <div class="row-title">${item.label}</div>
          <span class="status-pill ${item.status==='confirmed' ? 'status-approved' : (item.status==='clarify' ? 'status-review' : '')}" style="${item.status==='pending' ? 'background:var(--plum-100); color:var(--plum-700);' : ''}">${item.status==='confirmed' ? 'Confirmed' : (item.status==='clarify' ? 'Clarification Requested' : 'Awaiting Review')}</span>
        </div>
        ${item.editing ? `
          <textarea id="care-transition-edit-${item.key}" style="margin-top:8px;">${item.text}</textarea>
          <button type="button" class="btn-primary" style="margin-top:8px;" onclick="careTransitionSaveItemEdit('${item.key}')">Save</button>
        ` : `
          <p style="font-size:13.5px; margin-top:8px; line-height:1.5;">${item.text}</p>
        `}
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;">
          <button type="button" class="btn-secondary" style="flex:1; min-width:100px;" onclick="careTransitionConfirmItem('${item.key}')">Confirm</button>
          <button type="button" class="btn-secondary" style="flex:1; min-width:100px;" onclick="careTransitionEditItemToggle('${item.key}')">Edit</button>
          <button type="button" class="btn-secondary" style="flex:1; min-width:100px;" onclick="careTransitionRemoveItem('${item.key}')">Remove</button>
          <button type="button" class="btn-secondary" style="flex:1; min-width:100px;" onclick="careTransitionAskClarification('${item.key}')">Ask for Clarification</button>
        </div>
      </div>
    `).join('')}

    <button type="button" class="btn-primary" style="margin-top:10px;" onclick="careTransitionNext()">Continue to Create Plan</button>
  `;
}

function renderCareTransitionStep3() {
  const ct = state.careTransition;
  const byKey = key => ct.summaryItems.find(i => i.key === key);
  const section = (title, keys) => {
    const items = keys.map(byKey).filter(i => i && !i.removed);
    if (!items.length) return `<div class="divider-label">${title}</div><p class="empty-note">Nothing here yet.</p>`;
    return `
      <div class="divider-label">${title}</div>
      ${items.map(i => `<div class="row-card" style="display:block;"><p style="font-size:13px; margin:0;">${i.text}</p></div>`).join('')}
    `;
  };
  return `
    <h1 style="font-size:18px;">Create the Transition Plan</h1>
    <p style="font-size:12px; color:var(--ink-muted); margin-top:6px; line-height:1.5;">Confirmed and noted information from the review step, organized into a plan.</p>

    ${section('Follow-Up Actions', ['followUp'])}
    ${section('Home-Preparation Actions', ['homePrep'])}
    ${section('Daily-Care Needs', ['dailySupport'])}
    ${ct.clarificationQuestions.length ? `
      <div class="divider-label">Questions for the Healthcare Team</div>
      ${ct.clarificationQuestions.map(q => `<div class="row-card" style="display:block;"><p style="font-size:13px; margin:0;">${q.text}</p></div>`).join('')}
    ` : `<div class="divider-label">Questions for the Healthcare Team</div><p class="empty-note">No open questions yet — use "Ask for Clarification" in the review step to add one.</p>`}

    <div class="divider-label">Care Village Tasks</div>
    <p style="font-size:11.5px; color:var(--ink-muted); margin-bottom:8px;">Nothing is assigned automatically — review and assign each task yourself.</p>
    ${ct.planTasks.map(t => `
      <div class="task-card">
        <label style="display:flex; align-items:flex-start; gap:8px; cursor:pointer;">
          <input type="checkbox" ${t.done?'checked':''} onchange="careTransitionToggleTaskDone('${t.id}', this.checked)" style="width:18px; height:18px; margin-top:2px; flex-shrink:0;" aria-label="Mark ${t.title} complete" />
          <span class="task-title" style="${t.done?'text-decoration:line-through; color:var(--ink-muted);':''}">${t.title}</span>
        </label>
        <div class="field" style="margin-top:10px; margin-bottom:6px;">
          <label for="care-transition-due-${t.id}">Due date</label>
          <input id="care-transition-due-${t.id}" type="date" value="${t.due}" oninput="careTransitionUpdateTask('${t.id}', 'due', this.value)" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="care-transition-assignee-${t.id}">Assign to</label>
          <select id="care-transition-assignee-${t.id}" onchange="careTransitionUpdateTask('${t.id}', 'assignee', this.value)">

function renderCareTransitionStep4() {
  const ct = state.careTransition;
  const byKey = key => ct.summaryItems.find(i => i.key === key && !i.removed);
  const whatChanged = byKey('whatChanged');
  const followUp = byKey('followUp');
  const dailySupport = byKey('dailySupport');
  const villageSupport = byKey('villageSupport');
  const defaultUpdate = [
    whatChanged ? whatChanged.text : '',
    (dailySupport || villageSupport) ? 'Support needed: ' + [dailySupport && dailySupport.text, villageSupport && villageSupport.text].filter(Boolean).join(' ') : '',
    followUp ? 'Follow-up: ' + followUp.text : '',
  ].filter(Boolean).join('\n\n');
  const displayText = ct.updateText || defaultUpdate;

  return `
    <h1 style="font-size:18px;">Mobilize the Care Village</h1>
    <p style="font-size:12px; color:var(--ink-muted); margin-top:6px; margin-bottom:12px; line-height:1.5;">Review this update before sharing it with your Family Care Village.</p>

    ${ct.updateEditing ? `
      <div class="field">
        <label for="care-transition-update-text">Transition update</label>
        <textarea id="care-transition-update-text" rows="6">${displayText}</textarea>
      </div>
      <button type="button" class="btn-primary" onclick="careTransitionSaveUpdateText()">Save Update</button>
    ` : `
      <div class="ai-summary-box" style="white-space:pre-line;">${displayText}</div>
      <button type="button" class="btn-secondary" style="margin-top:10px;" onclick="careTransitionToggleEditUpdate()">Edit Update</button>
    `}

    <div class="divider-label">Confirmed Tasks &amp; Assignments</div>
    ${ct.planTasks.map(t => `
      <div class="row-card" style="display:block;">
        <div class="row-title" style="${t.done?'text-decoration:line-through; color:var(--ink-muted);':''}">${t.title}</div>
        <div class="row-sub">${t.assignee} ${t.due ? '· Due ' + formatDate(t.due) : '· No date set'}</div>
      </div>
    `).join('')}

    <div class="divider-label">Questions Still Requiring Clarification</div>
    ${ct.clarificationQuestions.length ? ct.clarificationQuestions.map(q => `
      <div class="row-card" style="display:block;"><p style="font-size:13px; margin:0;">${q.text}</p></div>
    `).join('') : '<p class="empty-note">None right now.</p>'}

    <div class="disclaimer" style="margin-top:16px;">
      <span class="mark">ⓘ</span>
      <span>This tool helps organize information and coordinate care. It does not provide medical advice, interpret emergencies, or replace instructions from qualified healthcare professionals. Verify all medical information with the appropriate care team.</span>
    </div>

    <button type="button" class="btn-primary" style="margin-top:14px;" onclick="careTransitionSavePlan()">Save Transition Plan</button>
    <button type="button" class="btn-secondary" style="margin-top:10px;" onclick="careTransitionShare()">Share With Care Village</button>
    ${ct.planSaved ? '<p class="empty-note" style="margin-top:8px;">✓ Transition plan saved for this session.</p>' : ''}
    ${ct.shared ? '<div class="ai-summary-box" style="margin-top:8px; background:var(--sage-100); color:#3E5A43;">Prototype demonstration: The transition update is ready to share with approved Care Village members.</div>' : ''}
  `;
}

// ---------------------------------------------------------------
// Actions
// ---------------------------------------------------------------
// ---------------------------------------------------------------
// Browser history integration — makes the native Back/Forward
// buttons work correctly between screens, without any backend or
// page reload. Every real screen change (tab switch, opening or
// closing an overlay) pushes one history entry; transient UI state
// (menus, checkboxes, form typing) does not.
// ---------------------------------------------------------------
function historyHash() {
  const parts = [state.tab];
  if (state.overlay) {
    parts.push(state.overlay.type);
    if (state.overlay.id !== null && state.overlay.id !== undefined) parts.push(String(state.overlay.id));
  }
  return '#' + parts.map(encodeURIComponent).join('/');
}
function pushHistoryState() {
  try {
    history.pushState({ tab: state.tab, overlay: state.overlay }, '', historyHash());
  } catch (e) {
    // Some environments (e.g. opening this file directly via file:// in
    // certain browsers) block history.pushState with a SecurityError.
    // Native Back/Forward simply won't track screens there — the app
    // itself must keep working regardless.
  }
}
function replaceHistoryState() {
  try {
    history.replaceState({ tab: state.tab, overlay: state.overlay }, '', historyHash());
  } catch (e) {
    // See note in pushHistoryState above.
  }
}

function setTab(t) {
  state.tab = t; state.overlay = null; state.desktopMoreOpen = false;
  pushHistoryState();
  render();
  window.scrollTo(0,0);
}
function toggleDesktopMore() { state.desktopMoreOpen = !state.desktopMoreOpen; render(); }
function openOverlay(type, id) {
  state.overlay = { type, id };
  pushHistoryState();
  render();
}
function closeOverlay() {
  state.overlay = null;
  pushHistoryState();
  render();
}

function selectCupLevel(level) {
  const data = currentCupData();
  data.level = level;
  data.committed = false;
  data.reflectionSavedAt = null;
  data.supportOpen = { respite:false, cupConvo:false, professional:false };
  render();
}

function saveCupReflection() {
  const data = currentCupData();
  if (data.committed) return; // already saved this check-in — ignore repeated taps
  data.reflection = {
    carrying: escapeHtml((document.getElementById('cr-carrying').value || '').trim()),
    helping: escapeHtml((document.getElementById('cr-helping').value || '').trim()),
    support: escapeHtml((document.getElementById('cr-support').value || '').trim()),
  };
  const time = new Date().toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  data.history.unshift({ id: 'cc' + state.nextCupHistoryId++, level: data.level, time });
  data.committed = true;
  data.reflectionSavedAt = time;
  render();
}

function skipCupReflection() {
  const data = currentCupData();
  if (data.committed) return; // already saved this check-in — ignore repeated taps
  const time = new Date().toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
  data.history.unshift({ id: 'cc' + state.nextCupHistoryId++, level: data.level, time });
  data.committed = true;
  render();
}

function askCareGuide() {
  const el = document.getElementById('cg-question');
  const raw = el ? el.value.trim() : '';
  if (!raw) {
    alert('Please type a question, or choose a category below instead.');
    return;
  }
  const safeQuestion = escapeHtml(raw);
  const category = matchCareGuideCategory(raw);

// Connects approved Care Transition tasks into the existing shared Tasks
// list (state.tasks), which already supports a `source` field distinguishing
// task origins. This is additive and idempotent — re-saving updates the
// same tasks in place by their stable id rather than duplicating them, and
// no existing task is ever changed or removed.
function careTransitionSavePlan() {
  const ct = state.careTransition;
  ct.planTasks.forEach(pt => {
    const existing = state.tasks.find(t => t.id === pt.id);
    if (existing) {
      existing.title = pt.title;
      existing.due = pt.due ? formatDate(pt.due) : '';
      existing.assignee = pt.assignee;
      existing.status = pt.done ? 'Completed' : existing.status;
    } else {
      state.tasks.push({
        id: pt.id,
        title: pt.title,
        assignee: pt.assignee,
        due: pt.due ? formatDate(pt.due) : '',
        status: pt.done ? 'Completed' : 'Not started',
        linkedVisit: null,
        overdue: false,
        source: 'careTransition',
        confirmed: true,
        category: 'Follow-Up',
        notes: '',
      });
    }
  });
  ct.planSaved = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> saved a Care Transition plan for ${state.careRecipient.name.split(' ')[0]}`);
  render();
}

  render();

  const followUpNote = escapeHtml(document.getElementById('nv-followup').value.trim());

  if (!provider || !reason || !date) {
    alert('Please fill in at least the provider, date, and reason for the visit.');
    return;
  }

  const id = 'v' + state.nextVisitId++;
  state.visits.push({
    id, provider, specialty: specialty || 'General', date: formatDate(date),
    reason, caregiverNotes: '', documents: [],
    aiSummary: null, draftMedChanges: [], draftFollowUps: [],
    medChangesConfirmed: false, approved: false, shared: false,
    followUpNote: followUpNote || '—', generating: false, error: null,
    additionalNotes: [], attachments: [],
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> saved a new visit with ${provider}`);
  openOverlay('visit', id);
}

// Step 2: upload notes or discharge paperwork
function handleFileUpload(id, inputEl) {
  const files = Array.from(inputEl.files || []);
  files.forEach(file => {
    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        addDocument(id, { name: file.name, kind: 'image', mediaType: file.type, data: base64 });
      };
      reader.readAsDataURL(file);
    } else if (file.type === 'application/pdf') {
      reader.onload = () => {
        const base64 = String(reader.result).split(',')[1];
        addDocument(id, { name: file.name, kind: 'pdf', data: base64 });
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = () => {
        addDocument(id, { name: file.name, kind: 'text', data: String(reader.result).slice(0, 6000) });
      };
      reader.readAsText(file);
    }
  });
}
function addDocument(id, doc) {
  const v = state.visits.find(x => x.id === id);
  if (v) v.documents.push(doc);
  openOverlay('visit', id);
}

function saveCaregiverNotes(id) {
  const v = state.visits.find(x => x.id === id);
  const el = document.getElementById('notes-' + id);
  if (v && el) v.caregiverNotes = escapeHtml(el.value);
  openOverlay('visit', id);
}

// Step 3: generate a plain-language draft
function generateDraft(id) {
  // STATIC DEMO ONLY: this prototype does not call any live AI service.
  // No network request is made and no API key is present anywhere in this file.
  const v = state.visits.find(x => x.id === id);
  if (!v) return;
  if (!v.caregiverNotes.trim() && v.documents.length === 0) {
    v.error = 'Add your notes or upload a document before generating a draft.';
    openOverlay('visit', id);
    return;
  }
  v.error = null;
  v.generating = true;
  openOverlay('visit', id);

  // Brief delay only to preserve the loading-state UX — no network call happens here.
  setTimeout(() => {
    const noteExcerpt = v.caregiverNotes ? v.caregiverNotes.trim().slice(0, 200) : null;
    v.aiSummary = `[Simulated demo output — no live AI service was called] This is a placeholder plain-language draft for the ${v.reason} visit with ${v.provider}. ${noteExcerpt ? `Your notes were: "${noteExcerpt}${v.caregiverNotes.length > 200 ? '…' : ''}"` : 'No caregiver notes were entered, so this text is a static example.'} In a connected version of this app, this section would contain an AI-written summary of the visit for caregiver review.`;
    v.draftMedChanges = [
      { id: `${v.id}-mc0`, name: 'Example Medication', change: 'Sample change description — static demo placeholder, not extracted from real data', checked: true },
    ];
    v.draftFollowUps = [
      { id: `${v.id}-fu0`, description: 'Example follow-up action — static demo placeholder', timeframe: '2 weeks', assignee: familyMembers[0], dueDate: '', selected: true, taskCreated: false },
    ];
    v.approved = false;
    v.medChangesConfirmed = false;
    v.shared = false;
    v.generating = false;
    openOverlay('visit', id);
  }, 500);
}

// Step 4: caregiver corrects and approves the draft
function approveDraft(id) {
  const v = state.visits.find(x => x.id === id);
  const el = document.getElementById('draft-' + id);
  if (v && el) v.aiSummary = escapeHtml(el.value);
  if (v) v.approved = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> approved the visit summary for ${v.date}`);
  openOverlay('visit', id);
}

// Step 5: confirm extracted medication changes
function toggleMedChange(id, i, checked) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges[i].checked = checked;
}
function editMedChange(id, i, field, value) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges[i][field] = escapeHtml(value);
}
function confirmMedChanges(id) {
  const v = state.visits.find(x => x.id === id);
  v.draftMedChanges = v.draftMedChanges.filter(m => m.checked !== false);
  v.medChangesConfirmed = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> confirmed medication changes for the ${v.date} visit`);
  openOverlay('visit', id);
}

// Step 6: convert follow-up instructions into tasks
function toggleFollowUp(id, i, checked) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps[i].selected = checked;
}
function editFollowUp(id, i, field, value) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps[i][field] = value;
}
function createTasksFromFollowUps(id) {
  const v = state.visits.find(x => x.id === id);
  v.draftFollowUps.forEach(f => {
    if (f.selected === false || f.taskCreated) return;
    const taskId = 't' + state.nextTaskId++;
    state.tasks.push({
      id: taskId,
      title: f.description,
      assignee: f.assignee,
      due: f.dueDate ? formatDate(f.dueDate) : (f.timeframe || ''),
      status: 'Not started',
      linkedVisit: v.id,
      overdue: false,
      source: 'suggested',
      confirmed: false,
      category: 'Follow-Up',
      notes: '',
    });
    f.taskCreated = true;
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> created follow-up tasks from the ${v.date} visit`);
  openOverlay('visit', id);
}

// Step 7: share only approved information with the Family Care Village
function shareVisit(id) {
  const v = state.visits.find(x => x.id === id);
  v.shared = true;
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> shared the ${v.date} visit with the Family Care Village`);
  openOverlay('visit', id);
}

// "Add to This Visit" — notes, documents, and photos, kept separate from the
// original visit information above so nothing gets overwritten.
function saveVisitNote(visitId, noteId) {
  const v = state.visits.find(x => x.id === visitId);
  const text = escapeHtml(document.getElementById('vn-text').value.trim());
  if (!text) {
    alert('Please write something before saving.');
    return;
  }
  if (noteId) {
    const n = v.additionalNotes.find(x => x.id === noteId);
    if (n) n.text = text;
    logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> updated a note on the ${v.date} visit`);
  } else {
    const date = new Date().toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
    v.additionalNotes.push({ id: 'an' + state.nextVisitNoteId++, text, date });
    logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> added a note to the ${v.date} visit`);
  }
  openOverlay('visit', visitId);
}

function handleVisitDocumentSelected(visitId, inputEl) {
  const files = inputEl.files;
  if (!files || !files.length) return; // picker cancelled
  state.pendingVisitDoc = { visitId, fileName: files[0].name };
  openOverlay('visitDocType');
}

function saveVisitDocument() {
  const pending = state.pendingVisitDoc;
  if (!pending) return;
  const v = state.visits.find(x => x.id === pending.visitId);
  const docType = document.getElementById('vd-type').value;
  const date = new Date().toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
  v.attachments.push({
    id: 'at' + state.nextVisitAttachmentId++,
    kind: 'document',
    name: escapeHtml(pending.fileName),
    docType: docType || '',
    date,
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> uploaded a document to the ${v.date} visit`);
  state.pendingVisitDoc = null;
  openOverlay('visit', v.id);
}

function cancelVisitDocument() {
  const visitId = state.pendingVisitDoc ? state.pendingVisitDoc.visitId : null;
  state.pendingVisitDoc = null;
  if (visitId) openOverlay('visit', visitId);
  else closeOverlay();
}

function handleVisitPhotoSelected(visitId, inputEl) {
  const files = inputEl.files;
  if (!files || !files.length) return; // picker cancelled
  const v = state.visits.find(x => x.id === visitId);
  const date = new Date().toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
  v.attachments.push({
    id: 'at' + state.nextVisitAttachmentId++,
    kind: 'photo',
    name: escapeHtml(files[0].name),
    docType: '',
    date,
  });
  logActivity(`<b>${state.currentUser.name.split(' ')[0]}</b> added a photo to the ${v.date} visit`);
  openOverlay('visit', visitId);
}

function removeVisitAttachment(visitId, attachmentId) {
  const v = state.visits.find(x => x.id === visitId);
  const a = v.attachments.find(x => x.id === attachmentId);
  const ok = confirm('Remove "' + (a ? a.name : 'this attachment') + '"? This can\'t be undone (demo data only).');
  if (!ok) return;
  v.attachments = v.attachments.filter(x => x.id !== attachmentId);
  openOverlay('visit', visitId);
}

document.addEventListener('click', function (e) {
  if (state.desktopMoreOpen && e.target && e.target.closest && !e.target.closest('.desktop-more')) {
    state.desktopMoreOpen = false;
    render();
  }
});

// Native Back/Forward button support: restore the screen recorded in
// history.state, or fall back to the dashboard if there is none (e.g. the
// user went back past the first screen this session recorded).
window.addEventListener('popstate', function (e) {
  try {
    if (e.state) {
      state.tab = e.state.tab;
      state.overlay = e.state.overlay;
    } else {
      state.tab = 'dashboard';
      state.overlay = null;
    }
    state.desktopMoreOpen = false;
    render();
  } catch (err) {
    // Never let a popstate handling issue leave the app stuck.
  }
});

// Establish a well-defined starting point in browser history for this
// session, so the very first Back press has something sensible to land on.
replaceHistoryState();

render();

</script>
</body>
</html>
